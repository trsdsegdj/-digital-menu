<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>WhatsApp Settings</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
	<link rel="stylesheet" href="css/admin.css?v=8">
</head>
<body>
	<main>
		<div class="page-header">
			<div>
				<p class="eyebrow">Contact</p>
				<h1>WhatsApp Settings</h1>
			</div>
		</div>
		<form id="whatsapp-form" class="admin-form">
			<div class="field-group">
				<label for="whatsapp">Business WhatsApp number</label>
				<input id="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+8801XXXXXXXXX" required>
			</div>
			<p id="whatsapp-status" class="form-status" role="status" aria-live="polite"></p>
			<button id="save" class="primary-btn" type="submit">Save number</button>
		</form>
	</main>
	<script type="module" src="js/auth.js?v=11"></script>
	<script type="module" src="js/whatsapp.js?v=4"></script>
</body>
</html>
