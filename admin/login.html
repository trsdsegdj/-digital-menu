<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Business Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/admin.css?v=8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #153a2d 40%, #1b7d59 100%);
      color: #eafaf1;
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 460px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .login-header {
      padding: 32px 32px 20px;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #2bd684, #0e9f6e);
      color: white;
      font-size: 1.8rem;
      font-weight: 800;
      box-shadow: 0 18px 32px rgba(18, 181, 109, 0.38);
    }

    .login-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.3rem);
      letter-spacing: -0.03em;
    }

    .login-header p {
      margin: 10px 0 0;
      color: rgba(234, 250, 241, 0.8);
      font-size: 0.96rem;
    }

    .login-body {
      padding: 28px 32px 32px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .field-group label {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(234, 250, 241, 0.9);
      text-transform: uppercase;
    }

    .field-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-group input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .field-group input:focus {
      border-color: rgba(115, 255, 178, 0.8);
      box-shadow: 0 0 0 4px rgba(115, 255, 178, 0.12);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2dd28a, #14a76c);
      color: #0a2217;
      font-size: 1rem;
      font-weight: 800;
      padding: 15px 18px;
      cursor: pointer;
      box-shadow: 0 18px 28px rgba(20, 181, 108, 0.28);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 32px rgba(20, 181, 108, 0.34);
    }

    .secondary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #f4fff9;
      font-size: 0.96rem;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }

    #auth-msg {
      min-height: 22px;
      margin-top: 18px;
      color: #dfffee;
      font-size: 0.92rem;
      text-align: center;
    }

    @media (max-width: 500px) {
      .login-card {
        border-radius: 20px;
      }

      .login-header,
      .login-body {
        padding-left: 22px;
        padding-right: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-badge">R</div>
        <h1>Admin Login</h1>
        <p>Manage your catalog, orders, and business details</p>
      </div>

      <div class="login-body">
        <div class="auth-form">
          <div class="field-group">
            <label for="admin-email">Email</label>
            <input id="admin-email" type="email" placeholder="admin@example.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" placeholder="Enter password" autocomplete="current-password">
          </div>

          <button id="login-btn" class="primary-btn" type="button">Login to Dashboard</button>
          <button id="signout" type="button" class="secondary-btn">Sign out</button>
        </div>

        <p id="auth-msg" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js?v=11"></script>
</body>
</html>
