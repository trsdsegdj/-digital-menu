<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">

<body>

    <h2>Business Admin</h2>

    <div class="page-header">
      <div>
        <p class="eyebrow">Catalog Setup</p>
        <h1>Category Management</h1>
      </div>
    </div>

    <div class="panel">
      <div class="form-row" style="display:flex; flex-wrap:wrap; gap:12px; align-items:end;">

          <label for="categoryName" style="display:block; margin-bottom:8px; font-weight:700; color:#2a3e35;">Category name</label>

        <button id="addCategory" class="primary-btn" type="button">Add Category</button>
      </div>
      <p id="category-status" class="form-status" role="status" aria-live="polite"></p>
      <div id="categoryList" class="list-stack"></div>
